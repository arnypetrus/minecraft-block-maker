<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Minecraft Block Maker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#1e1f22;--pn:#2b2d31;--ln:#3a3c42;--tx:#e6e6e6;--ac:#5cb85c}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh}
aside{width:270px;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;overflow:auto}
main{flex:1;overflow:auto;padding:18px}
h3{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;display:flex;justify-content:space-between;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:#383a40;border:1px solid var(--ln);border-radius:5px;padding:5px 8px}
button{cursor:pointer}button:hover{background:#44474e}button.p{background:var(--ac);color:#111;border:0;font-weight:600}
.li{padding:7px 12px;cursor:pointer;border-left:3px solid transparent}.li.on{background:#383a40;border-color:var(--ac)}
.tex{display:flex;align-items:center;gap:8px;padding:4px 12px}.tex img,.th{width:32px;height:32px;image-rendering:pixelated;background:#111;border:1px solid var(--ln)}
.row{display:flex;gap:10px;align-items:center;margin:7px 0;flex-wrap:wrap}.row label{width:120px;opacity:.8}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:14px;max-width:640px}
.bar{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}small{opacity:.6}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}#ov .card{width:420px}
</style></head><body>
<aside>
 <div class="bar"><button onclick="newDlg()">New</button><button onclick="$('#of').click()">Open</button><button onclick="save()">Save .mcbm</button><button class="p" onclick="exp()">Export mod</button><button onclick="getPk()" title="Builds an exported zip into a .jar">Get Packager</button></div>
 <input type="file" id="of" accept=".mcbm,.json" hidden onchange="openF(this.files[0])">
 <h3>Blocks <button onclick="addB()">+</button></h3><div id="bl"></div>
 <h3>Textures <button onclick="$('#tf').click()">+ Upload</button></h3><div id="tl"></div>
 <input type="file" id="tf" accept="image/png" multiple hidden onchange="upT(this.files)">
</aside>
<main id="m"></main>
<div id="ov"><div class="card" id="dlg"></div></div>

 const b=P.blocks[cur];
 let h=`<div class="card"><b>${esc(P.name)}</b> <small>mod id: ${P.modId} · Minecraft <select onchange="P.version=this.value;render()">${Object.keys(VERSIONS).map(v=>`<option ${v==P.version?'selected':''}>${v}</option>`).join('')}</select> · ${VERSIONS[P.version].loader} · needs JDK ${VERSIONS[P.version].jdk}</small></div>`;
 if(!b){$('#m').innerHTML=h+'<div class="card">Add a block with the + button.</div>';return}
 const rc=b.recipe||(b.recipe={on:false,shaped:true,count:1,grid:Array(9).fill('')});
 const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
 const texOpt=v=>'<option value="">— none —</option>'+Object.keys(P.textures).map(n=>`<option ${n==v?'selected':''}>${esc(n)}</option>`).join('');
 h+=`<div class="card"><div class="row"><label>Display name</label><input value="${esc(b.name)}" oninput="b_('name',this.value)"></div>
 <div class="row"><label>Block ID</label><input value="${b.id}" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'');b_('id',this.value)"><small>a–z, 0–9, _</small></div>
 <div class="row"><label>Block type</label><select onchange="b_('type',this.value,1)">${opt(TYPES,b.type)}</select></div></div>
 <div class="card"><b>Face textures</b><div class="row"><label>Set all faces</label><select onchange="setAll(this.value)">${texOpt('')}</select></div>`;
 for(const[f,l]of Object.entries(FACES[b.type])){const t=b.faces[f];
  h+=`<div class="row"><label>${l}</label><img class="th" src="${t&&P.textures[t]||''}"><select onchange="P.blocks[cur].faces['${f}']=this.value;render()">${texOpt(t)}</select></div>`}
 h+=`<small>Unassigned faces reuse the first assigned texture.</small></div>
 <div class="card"><b>Properties</b>
 <div class="row"><label>Hardness</label><input type="number" step="0.1" min="0" value="${b.hardness}" oninput="b_('hardness',+this.value)"><small>stone = 1.5, dirt = 0.5</small></div>
 <div class="row"><label>Blast resistance</label><input type="number" step="0.1" min="0" value="${b.resist}" oninput="b_('resist',+this.value)"></div>

 <div class="row"><label>Needs correct tool</label><input type="checkbox" ${b.needTool?'checked':''} onchange="b_('needTool',this.checked)"><small>drops nothing without the right tool</small></div>
 <div class="row"><label>Transparent</label><input type="checkbox" ${b.transparent?'checked':''} onchange="b_('transparent',this.checked)"><small>glass-like: see-through pixels, no occlusion</small></div>
 <div class="row"><label>Unbreakable</label><input type="checkbox" ${b.unbreakable?'checked':''} onchange="b_('unbreakable',this.checked)"></div></div>
 <div class="card"><b>Crafting recipe</b>
 <div class="row"><label>Craftable</label><input type="checkbox" ${rc.on?'checked':''} onchange="P.blocks[cur].recipe.on=this.checked;render()"></div>`;
 if(rc.on){h+=`<div class="row"><label>Type</label><select onchange="P.blocks[cur].recipe.shaped=this.value=='1';render()"><option value="1" ${rc.shaped?'selected':''}>Shaped (pattern matters)</option><option value="0" ${rc.shaped?'':'selected'}>Shapeless (any arrangement)</option></select></div>

 <small>Type an item ID (stone, minecraft:iron_ingot), a tag (#minecraft:planks), or one of your own blocks (${P.modId}:block_id). Leave cells empty for blank slots.<br>Need an ID? <a href="https://crafty.gg/tools/item-ids" target="_blank" rel="noopener" style="color:var(--ac)">Look up item IDs on crafty.gg</a> (pick your Minecraft version there).</small>`}
 h+=`</div>
 <button onclick="delB()">Delete this block</button>`;
 $('#m').innerHTML=h}
function b_(k,v,r){const b=P.blocks[cur],old=b[k];b[k]=v;

 if(k=='type')b.faces={};

async function upT(fs){if(!P)return alert('Create a project first.');
